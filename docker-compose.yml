services:
  delta-recovery:
    build: .
    image: delta-recovery-analyzer:latest
    container_name: delta-recovery-analyzer
    ports:
      - "8000:8000"
    environment:
      # 内置样例目录（容器内路径）；可通过挂载覆盖
      SAMPLE_ROOT: /srv/samples
    volumes:
      # 可写挂载：网页“恢复演练”会把新提交追加到 samples/*/_delta_log，
      # 容器内需要写权限；宿主机 samples/ 同步更新，停止容器后仍保留演练结果
      - ./samples:/srv/samples
    restart: unless-stopped
